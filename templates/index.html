<!DOCTYPE html>
<html>
<head>
    <title>Crypto AI Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>

<header>
    🚀 Crypto Prediction Dashboard
</header>

<div class="container">

    <form method="POST">
        <select name="crypto">
            <option value="BTC-USD">Bitcoin</option>
            <option value="ETH-USD">Ethereum</option>
            <option value="DOGE-USD">Dogecoin</option>
        </select>

        <input type="number" name="days" value="30" min="7" max="60">

        <button type="submit">Predict</button>
    </form>

    {% if forecast %}
    <h2>📊 Predictions</h2>

    <div id="loading">⏳ Predicting... please wait</div>
    <div id="chart"></div>

    <script>
        const data = {{ forecast | tojson | safe }};
        console.log("Forecast Data:", data); 

        if (data && data.length > 0) {

            const dates = data.map(item => item.index);
            const prices = data.map(item => item.Close);

            var trace = {
                x: dates,
                y: prices,
                mode: 'lines+markers',
                type: 'scatter'
            };

            var layout = {
                title: "Future Price Prediction",
                paper_bgcolor: "#0f172a",
                plot_bgcolor: "#0f172a",
                font: { color: "white" }
            };

            Plotly.newPlot('chart', [trace], layout);

            document.getElementById("loading").style.display = "none";

        } else {
            document.getElementById("chart").innerHTML = "No data available";
        }
    </script>

    {% endif %}

</div>

</body>
</html>
